version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: safeslice
    main: ./cmd/safeslice
    binary: safeslice
    # CGO_ENABLED=0 is the whole distribution story: one file, no runtime, no
    # libc dependency. The pure-Go SQLite driver exists so this stays true.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # Version-less filenames, so /releases/latest/download/<file> is a stable URL
  # the README can hardcode. With the version in the name that link breaks on
  # every release, and the install instructions rot silently.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, NOTICE, safeslice.example.yaml]

# No Homebrew tap: a tap repository must be named homebrew-*, and this project
# deliberately ships from one repo. Once it clears Homebrew core's notability
# bar, the formula can live there instead and needs no tap at all.

nfpms:
  - file_name_template: "{{ .ProjectName }}_{{ .Arch }}"
    maintainer: Autometiq <hello@autometiq.com>
    description: Pull a small, PII-scrubbed, referentially-intact slice of a PostgreSQL database.
    license: Apache-2.0
    formats: [deb, rpm, apk]

# dockers_v2 replaces the deprecated `dockers` block. Repository names must be
# lowercase -- "ghcr.io/Autometiq/..." is rejected outright by the OCI spec, and
# the owner name here is capitalised.
dockers_v2:
  - images:
      - "ghcr.io/autometiq/safeslice"
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    sbom: false

checksum:
  name_template: checksums.txt

# The release notes are generated, not written by hand. A release that needs a
# human to remember to describe it is a release that eventually ships with an
# empty body -- so the changelog is grouped by conventional-commit type and the
# install instructions are templated from the tag.
changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      # Both forms of every prefix. `ci:` and `ci(release):` are the same kind
      # of commit, and only excluding the first puts plumbing in the notes.
      - '^docs:'
      - '^docs\('
      - '^test:'
      - '^test\('
      - '^chore:'
      - '^chore\('
      - '^ci:'
      - '^ci\('
      - '^style:'
      - '^style\('
      - '^refactor:'
      - '^refactor\('
      - '^build:'
      - '^build\('
      - '^wip'
      - 'Merge pull request'
      - 'Merge branch'
      - 'Merge:'

release:
  name_template: "{{ .Tag }}"
  # Idempotent: re-running a failed release replaces its artifacts instead of
  # erroring on the ones that already uploaded.
  mode: replace
  header: |
    Run `safeslice` with no arguments and answer the questions. It reads the
    schema, asks about the columns it cannot classify, shows exactly what the
    slice contains before anything moves, loads it, verifies the result and
    writes the report.

    `init`, `plan`, `run`, `verify` and `demo` remain unchanged for CI.
  footer: |
    ## Install

    ```bash
    go install github.com/Autometiq/safeslice/cmd/safeslice@{{ .Tag }}
    ```

    Or take a binary from below — Linux, macOS and Windows on amd64 and arm64.
    One static file: no runtime, no libc dependency.

    ```bash
    curl -sSfL https://github.com/Autometiq/safeslice/releases/download/{{ .Tag }}/safeslice_linux_amd64.tar.gz | tar xz
    sudo mv safeslice /usr/local/bin/
    safeslice --version
    ```

    Verify what you downloaded:

    ```bash
    curl -sSfLO https://github.com/Autometiq/safeslice/releases/download/{{ .Tag }}/checksums.txt
    sha256sum -c checksums.txt --ignore-missing
    ```

    Docker, and Debian / RHEL / Alpine packages:

    ```bash
    docker run --rm ghcr.io/autometiq/safeslice:{{ .Version }} --help
    sudo dpkg -i safeslice_amd64.deb   # or rpm -i / apk add --allow-untrusted
    ```

    ---

    Tested against PostgreSQL 13 and 17 in CI. Safeslice opens the source
    read-only and never writes to it.
